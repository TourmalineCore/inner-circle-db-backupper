apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "{{ .Values.extraConfigMapEnvVars.INNER_CIRCLE_BACKUPS_SCHEDULE }}"
  # How many completed jobs should be kept
  successfulJobsHistoryLimit: 1
  # We use concurrencyPolicy: Forbid to make sure that a new cronjob doesn't kill a previously started cronjob before it's completed
  # Here you can read about concurrencyPolicy: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#concurrency-policy
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ .Release.Name }}
          restartPolicy: OnFailure
          containers:
            - name: {{ .Release.Name }}
              # The "InvalidImageName" error occurs when trying to deploy a locally built docker image with an empty (local) registry. 
              # If we leave registry empty, then there will be an excess slash(/) in front of the repository
              {{- if .Values.image.registry }}
              image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
              {{- else }}
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              {{- end }}
              resources:
                limits:
                  cpu: {{ .Values.resources.limits.cpu }}
                  memory: {{ .Values.resources.limits.memory }}
                requests:
                  cpu: {{ .Values.resources.requests.cpu }}
                  memory: {{ .Values.resources.requests.memory }}
              env:
                - name: NAMESPACE
                  value: {{ .Release.Namespace }}
                - name: INNER_CIRCLE_BACKUPS_BUCKET_ACCESS_KEY_ID
                  value: {{ .Values.extraSecretEnvVars.INNER_CIRCLE_BACKUPS_BUCKET_ACCESS_KEY_ID}}
                - name: INNER_CIRCLE_BACKUPS_BUCKET_SECRET_ACCESS_KEY
                  value: {{ .Values.extraSecretEnvVars.INNER_CIRCLE_BACKUPS_BUCKET_SECRET_ACCESS_KEY}}
                - name: INNER_CIRCLE_BACKUPS_BUCKET_ENDPOINT
                  value: {{ .Values.extraSecretEnvVars.INNER_CIRCLE_BACKUPS_BUCKET_ENDPOINT}}
                - name: INNER_CIRCLE_BACKUPS_BUCKET_NAME
                  value: {{ .Values.extraSecretEnvVars.INNER_CIRCLE_BACKUPS_BUCKET_NAME}}
              imagePullPolicy: {{ .Values.image.pullPolicy }}